<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bnnuy Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: url('bg.png') center center fixed;
            background-size: cover;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(5, 200px);
            gap: 1rem;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery img {
            width: 200px;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background: white;
            padding: 0.5rem;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .gallery img:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.25);
        }

        @media (max-width: 1200px) {
            .gallery {
                grid-template-columns: repeat(4, 200px);
            }
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(3, 200px);
            }
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 200px);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: repeat(1, 200px);
            }
        }

        .copy-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 1000;
        }

        .copy-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <h1>🐇</h1>
    <div class="gallery">
        <img src="shocked_loaf.webp" alt="Bunny 1">
        <img src="tongue.webp" alt="Bunny 2">
        <img src="hungry.webp" alt="Bunny 3">
        <img src="ear.webp" alt="Bunny 4">
        <img src="sniffa.webp" alt="Bunny 5">
        <img src="ough.webp" alt="Bunny 6">
        <img src="rest.webp" alt="Bunny 7">
        <img src="blomp.webp" alt="Bunny 8">
        <img src="sad.webp" alt="Bunny 9">
        <img src="blanket.webp" alt="Bunny 10">
    </div>

    <div class="copy-toast" id="copyToast">Copied to clipboard</div>

    <script>
        var toast = document.getElementById('copyToast');
        var toastTimeout;

        document.querySelectorAll('.gallery img').forEach(function (img) {
            img.addEventListener('click', function () {
                var url = new URL(img.getAttribute('src'), window.location.href).href;
                navigator.clipboard.writeText(url);

                clearTimeout(toastTimeout);
                toast.classList.add('show');
                toastTimeout = setTimeout(function () {
                    toast.classList.remove('show');
                }, 1800);
            });
        });
    </script>
</body>
</html>
